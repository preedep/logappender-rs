[package]
name = "logappender-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = {version = "1", features = ["full"]}
tokio-retry  = "0.3"
pretty_env_logger = "0.5"
log = "0.4"
serde = {version = "1" , features = ["derive"]}
serde_json = "1"
async-trait = "0.1"
config = "0.15"
rdkafka = {version = "0.37" , features = ["tokio","ssl","sasl"]}
tracing = "0.1.41"
tempfile = "3.16.0"
once_cell = "1.20"
chrono = { version = "0.4" , features = ["serde"] }